<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Simulator — 35 Questions</title>
<style>
:root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #20352a; background: #f3f6f3; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; }
main { max-width: 850px; margin: auto; }
h1 { font-size: 26px; margin: 0 0 8px; }
.intro { color: #526358; margin: 0 0 24px; }
#python-quiz { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 24px #17332512; }
h2 { font-size: 22px; }
p { line-height: 1.6; }
pre { padding: 18px; background: #20252a; color: #f5f7fa; border-radius: 8px; line-height: 1.6; font-size: 15px; }
code { font-family: Consolas, monospace; }
.form-check { display: flex; align-items: flex-start; gap: 12px; border: 1px solid #cbd6ce; border-radius: 8px; padding: 16px; cursor: pointer; line-height: 1.5; overflow-wrap: anywhere; }
.form-check:has(input:checked) { background: #e7f3e5; border-color: #679e5a; }
.form-check:has(input:focus-visible) { outline: 3px solid #c68c49; outline-offset: 2px; }
.form-check-input { flex: 0 0 auto; margin-top: 4px; width: 18px; height: 18px; accent-color: #43763c; }
.viz-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
#pq-count { color: #526358; }
.btn { font: inherit; padding: 12px 20px; border: 1px solid #43763c; border-radius: 8px; color: #173325; background: white; cursor: pointer; min-height: 44px; }
.btn-primary { background: #43763c; color: white; }
.btn:hover { filter: brightness(.95); }
.btn:focus-visible { outline: 3px solid #c68c49; outline-offset: 3px; }
[hidden] { display: none !important; }
#pq-feedback:not(:empty) { padding: 16px; background: #eff5ee; border-left: 4px solid #679e5a; border-radius: 4px; }
@media (max-width: 480px) { #python-quiz { padding: 18px; } body { padding: 16px 10px; } }
</style>
</head>
<body>
<main>
<h1>Python Simulator</h1>
<p class="intro">35 questions · Select your answer and click Check.</p>
<div id="python-quiz">
  <div class="viz-row"><span id="pq-count" class="tabular-nums"></span></div>
  <h2 id="pq-title"></h2>
  <p id="pq-question"></p>
  <pre id="pq-code" style="white-space:pre-wrap;overflow-wrap:anywhere"><code></code></pre>
  <form id="pq-form"><div id="pq-options" style="display:grid;gap:12px"></div><div class="viz-row" style="margin-top:20px"><button type="submit" class="btn btn-primary" id="pq-check">Check</button><button type="button" class="btn" id="pq-next" hidden>Next question</button></div></form>
  <p id="pq-feedback" aria-live="polite"></p>
</div>
<script>
(() => {
const root=document.getElementById('python-quiz');
const el=id=>root.querySelector('#pq-'+id);
const standard='What is the result of the following code fragment?';
const questions=[
{q:standard,c:`my_list = [1, 2]

for v in range(2):
    my_list.insert(-1, my_list[v])

print(my_list)`,o:['[1, 2, 2, 2]','[2, 1, 1, 2]','[1, 2, 1, 2]','[1, 1, 1, 2]'],a:[3],e:'insert(-1, ...) inserts before the last element. First the list becomes [1, 1, 2]; then my_list[1] is 1 and it becomes [1, 1, 1, 2].'},
{q:'The meaning of a positional argument is determined by:',o:['its position within the argument list','its value','its connection to existing variables','the name of the argument together with its value'],a:[0],e:'Positional arguments are assigned to parameters according to the order in which they are passed to the function.'},
{q:'Which of the following statements are true about the code? (Select two answers)',c:`nums = [1, 2, 3]
vals = nums`,o:['nums and vals are different names for the same list','nums has the same length as vals','vals is longer than nums','nums and vals are different lists'],a:[0,1],e:'vals = nums does not copy the list: both names point to the same object, so they have the same length.'},
{q:'An operator used to check whether two values are not equal is written as:',o:['<>','!=','not ==','=/='],a:[1],e:'In Python, != compares two values and returns True when they are different.'},
{q:'The following code fragment:',c:`def function_1(a):
    return None


def function_2(a):
    return function_1(a) * function_1(a)


print(function_2(2))`,o:['will output 16','will raise a runtime error','will output 4','will output 2'],a:[1],e:'function_1 returns None. Multiplying None by None raises a TypeError, so no numeric result is printed.'},
{q:'The result of the following division:',c:'1 // 2',o:['is equal to 0.0','cannot be predicted','is equal to 0','is equal to 0.5'],a:[2],e:'// is floor division. With two integers, 1 // 2 returns the integer 0.'},
{q:'The following code fragment:',c:`def func(a, b):
    return b ** a


print(func(b=2, 2))`,o:['will output 2','will output 4','is invalid','will output None'],a:[2],e:'In this call, a positional argument appears after a keyword argument. That syntax raises a SyntaxError.'},
{q:'What value will be assigned to variable x?',c:`z = 0
y = 10
x = y < z and z > y or y < z and z < y`,o:['1','True','0','False'],a:[3],e:'y < z is 10 < 0, which is False. Both groups joined by and are False; False or False returns the boolean False, not the integer 0.'},
{q:'Which of the following variable names are illegal and will raise a SyntaxError? (Select two answers)',o:['In','for','print','in'],a:[1,3],e:'for and in are reserved keywords. In is valid because Python is case-sensitive; print can also be a variable name, although it would shadow the built-in function.'},
{q:standard,c:`my_list = [x * x for x in range(5)]


def fun(lst):
    del lst[lst[2]]
    return lst


print(fun(my_list))`,o:['[0, 1, 4, 9]','[0, 1, 9, 16]','[1, 4, 9, 16]','[0, 1, 4, 16]'],a:[0],e:'The initial list is [0, 1, 4, 9, 16]. lst[2] is 4, so del lst[lst[2]] removes the element at index 4, which is 16.'},
{q:standard,c:`x = 1
y = 2
x, y, z = x, x, y
z, y, z = x, y, z

print(x, y, z)`,o:['1 2 1','1 1 2','1 2 2','2 1 2'],a:[1],e:'The first assignment leaves x=1, y=1, z=2. In the second, the right-hand side is evaluated before assignment: z receives 1 first and then 2. The result is 1 1 2.'},
{q:standard,c:`a = 1
b = 0
a = a ^ b
b = a ^ b
a = a ^ b

print(a, b)`,o:['0 0','0 1','1 0','1 1'],a:[1],e:'^ is bitwise XOR. The assignments produce a=1, then b=1, and finally a=0. It prints 0 1.'},
{q:standard,c:`def fun(x):
    if x % 2 == 0:
        return 1
    else:
        return 2


print(fun(fun(2)))`,o:['None','1','the code will raise a runtime error','2'],a:[3],e:'fun(2) returns 1 because 2 is even. Then fun(1) returns 2 because 1 is odd.'},
{q:'Observe the code fragment and choose the true statement:',c:`nums = [1, 2, 3]
vals = nums
del vals[:]`,o:['the code will raise a runtime error','nums and vals have the same length','vals is longer than nums','nums is longer than vals'],a:[1],e:'Both names refer to the same list. del vals[:] removes all its elements, so both lengths are 0.'},
{q:'What is the result of the following code fragment if the user enters two lines containing 3 and 2 respectively?',c:`x = int(input())
y = int(input())
x = x % y
x = x % y
y = y % x
print(y)`,o:['1','2','3','0'],a:[3],e:'3 % 2 gives 1; then 1 % 2 is still 1. Finally 2 % 1 gives 0, which is the printed value.'},
{q:'What is the result of the following code fragment if the user enters two lines containing 3 and 6 respectively?',c:`y = input()
x = input()
print(x + y)`,o:['36','6','3','63'],a:[3],e:'input returns strings. y receives "3" and x receives "6"; x + y concatenates the strings in the order "6" + "3", producing 63.'},
{q:standard,c:`print("a", "b", "c", sep="sep")`,o:['asepbsepcsep','a b c','abc','asepbsepc'],a:[3],e:'sep="sep" inserts sep between arguments without adding it at the end: a + sep + b + sep + c produces asepbsepc.'},
{q:standard,c:`x = 1 // 5 + 1 / 5
print(x)`,o:['0','0.5','0.4','0.2'],a:[3],e:'1 // 5 is 0 and 1 / 5 is 0.2. The sum is the float 0.2.'},
{q:'Assuming my_tuple is a correctly created tuple, the fact that tuples are immutable means that the following statement:',c:'my_tuple[1] = my_tuple[1] + my_tuple[0]',o:['may be illegal if the tuple contains strings','is illegal','is completely correct','can be executed only if the tuple contains at least two elements'],a:[1],e:'A tuple does not allow reassigning its elements by index. Even if the sum can be calculated, assigning to my_tuple[1] is not allowed.'},
{q:'What is the result of the following code fragment if the user enters two lines containing 2 and 4 respectively?',c:`x = float(input())
y = float(input())
print(y ** (1 / x))`,o:['1.0','0.0','2.0','4.2'],a:[2],e:'x=2.0 and y=4.0. The exponent is 1 / 2.0 = 0.5; 4.0 raised to 0.5 gives 2.0.'},
{q:standard,c:`dct = {'one': 'two', 'three': 'one', 'two': 'three'}
v = dct['three']

for k in range(len(dct)):
    v = dct[v]

print(v)`,o:["('one', 'two', 'three')",'two','one','three'],a:[2],e:'v starts as one. The loop runs three steps: one → two → three → one. It prints one.'},
{q:'How many elements does the list lst contain?',c:'lst = [i for i in range(-1, -2)]',o:['one','zero','two','three'],a:[1],e:'range uses a default step of 1. Since -1 is already greater than the limit -2, no values are generated and the list is empty.'},
{q:'Which of the following lines correctly calls the function defined below? (Select two answers)',c:`def fun(a, b, c=0):
    # Function body.`,o:['fun(0, 1, 2)','fun(b=0, a=0)','fun(b=1)','fun()'],a:[0,1],e:'a and b are required; c has a default value. The first two calls provide a and b. The others omit at least one of those parameters.'},
{q:standard,c:`def fun(x, y):
    if x == y:
        return x
    else:
        return fun(x, y-1)


print(fun(0, 3))`,o:['1','the code will raise a runtime error','2','0'],a:[3],e:'The calls are fun(0,3), fun(0,2), fun(0,1), and fun(0,0). When x and y are equal, the function returns x, which is 0.'},
{q:'How many (*) will the following code print to the console?',c:`i = 0
while i < i + 2 :
    i += 1
    print("*")
else:
    print("*")`,o:['1','2','the fragment will enter an infinite loop, printing one * per line','0'],a:[2],e:'For any integer i, i < i + 2 is always true. The loop continues indefinitely, prints an asterisk each iteration, and never reaches else.'},
{q:standard,c:`tup = (1, 2, 4, 8)
tup = tup[-2:-1]
tup = tup[-1]
print(tup)`,o:['4','(4,)','44','(4)'],a:[0],e:'The slice [-2:-1] produces the tuple (4,). Then [-1] extracts the integer 4. print prints 4 without parentheses.'},
{q:standard,c:`dd = {"1": "0", "0": "1"}
for x in dd.vals():
    print(x, end="")`,o:['1 0','0 0','the code is invalid (the dict object has no vals() method)','0 1'],a:[2],e:'Dictionaries have the values() method, not vals(). The call dd.vals() raises AttributeError before the loop executes.'},
{q:standard,c:`dct = {}
dct['1'] = (1, 2)
dct['2'] = (2, 1)

for x in dct.keys():
    print(dct[x][1], end="")`,o:['21','(2,1)','(1,2)','12'],a:[0],e:'The keys are iterated in insertion order. The element at index 1 of (1, 2) is 2 and of (2, 1) is 1. end="" prints them together as 21.'},
{q:standard,c:`def fun(inp=2, out=3):
    return inp * out


print(fun(out=2))`,o:['6','4','the code is invalid and will raise a SyntaxError','2'],a:[1],e:'out is replaced by 2 and inp keeps its default value 2. The function returns 2 × 2 = 4.'},
{q:'How many (#) will the following code print to the console?',c:`lst = [[x for x in range(3)] for y in range(3)]

for r in range(3):
    for c in range(3):
        if lst[r][c] % 2 != 0:
            print("#")`,o:['three','nine','six','zero'],a:[0],e:'The list contains three rows [0, 1, 2]. Only 1 is odd, so one # is printed per row: three in total.'},
{q:'What is the expected behavior of the following program if the user enters 0?',c:`try:
    value = input("Enter a value: ")
    print(int(value)/len(value))
except ValueError:
    print("Incorrect input...")
except ZeroDivisionError:
    print("Wrong input...")
except TypeError:
    print("Very wrong input...")
except:
    print("Buuu!")`,o:['Buuu!','1.0','0.0','Very wrong input...','Wrong input...'],a:[2],e:'value is the string "0", whose length is 1. int(value) is 0; 0 / 1 gives 0.0 and no exception is raised.'},
{q:'What is the expected behavior of the following program?',c:`try:
    print(5/0)
    break
except:
    print("Sorry, something went wrong...")
except (ValueError, ZeroDivisionError):
    print("Bad luck...")`,o:['The program will raise a SyntaxError.','The program will raise a ValueError and print a default error message.','The program will raise an exception and it will be handled by the first except block.','The program will raise a ZeroDivisionError and print the following message: Bad luck...','The program will raise a ValueError and print the following message: Bad luck...'],a:[0],e:'The code cannot compile: break is outside a loop and the bare except must be the last handler. It is a SyntaxError before executing 5/0.'},
{q:'What is the expected behavior of the following program?',c:`foo = (1, 2, 3)
foo.index(0)`,o:['The program will raise an AttributeError.','The program will raise a ValueError.','The program will raise a TypeError.','The program will raise a SyntaxError.','The program will print 1 on the screen.'],a:[1],e:'Tuples do have index(). Because the value 0 does not appear in (1, 2, 3), index(0) raises ValueError.'},
{q:'Which of the following snippets shows the correct way to handle multiple exceptions in a single except clause?',c:`# A:
except (TypeError, ValueError, ZeroDivisionError):
    # Some code.

# B:
except TypeError, ValueError, ZeroDivisionError:
    # Some code.

# C:
except: (TypeError, ValueError, ZeroDivisionError)
    # Some code.

# D:
except: TypeError, ValueError, ZeroDivisionError
    # Some code.

# E:
except (TypeError, ValueError, ZeroDivisionError)
    # Some code.

# F:
except TypeError, ValueError, ZeroDivisionError
    # Some code.`,o:['A only','A and B','B and C','D and E','F only','A, C, and D'],a:[0],e:'To catch multiple exception types in a single Python 3 handler, you write except (Type1, Type2, Type3):. Only A uses the correct parentheses and colon for that purpose.'},
{q:'What will happen when you try to run the following code?',c:'print(Hello, World!)',o:['The code will raise a TypeError.','The code will raise an AttributeError.','The code will raise a SyntaxError.','The code will print Hello, World! to the console.','The code will raise a ValueError.'],a:[2],e:'Hello, World! is not enclosed in quotes and is not a valid Python expression. The code raises a SyntaxError before it runs.'}
];
let current=0; const answers=[];
function draw(){
 const q=questions[current]; el('count').textContent=`${current+1} / ${questions.length}`;el('title').textContent=`Question ${current+1}`;
 el('question').textContent=q.q;el('question').hidden=!q.q;el('code').hidden=!q.c;el('code').firstElementChild.textContent=q.c||'';
 el('options').replaceChildren(); q.o.forEach((option,i)=>{const label=document.createElement('label');label.className='form-check';const input=document.createElement('input');input.type=q.a.length>1?'checkbox':'radio';input.name='answer';input.value=i;input.className='form-check-input';const span=document.createElement('span');span.className='form-check-label';span.textContent=option;label.append(input,span);el('options').append(label);});
 el('feedback').textContent='';el('check').hidden=false;el('check').disabled=false;el('next').hidden=true;
}
el('form').addEventListener('submit',event=>{event.preventDefault();const q=questions[current];const selected=Array.from(el('options').querySelectorAll('input:checked')).map(input=>Number(input.value));if(selected.length!==q.a.length){el('feedback').textContent=q.a.length>1?'Select two answers.':'Select one answer.';return;}
 const correct=selected.every(i=>q.a.includes(i));answers[current]=correct;
 const correctLabel=q.a.length>1 ? 'Correct answers' : 'Correct answer';
 el('feedback').textContent=(correct ? 'Correct. ' : 'Incorrect. ') + `${correctLabel}: ${q.a.map(i=>q.o[i]).join(' • ')}. ` + q.e;
 el('options').querySelectorAll('input').forEach(input=>input.disabled=true);el('check').hidden=true;el('next').hidden=false;el('next').textContent=current===34?'See result':'Next question';
});
el('next').addEventListener('click',()=>{if(current<34){current++;draw();}else{el('count').textContent='35 / 35';el('title').textContent='Result';el('question').hidden=false;el('question').textContent=`${answers.filter(Boolean).length} correct answers out of 35.`;el('code').hidden=true;el('form').hidden=true;el('feedback').textContent='';const restart=document.createElement('button');restart.type='button';restart.className='btn btn-primary';restart.textContent='Retry';restart.addEventListener('click',()=>{current=0;answers.length=0;el('form').hidden=false;restart.remove();draw();});root.append(restart);}});
draw();
})();
</script>
